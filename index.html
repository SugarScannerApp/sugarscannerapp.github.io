<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sugar Scanner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.9.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f9f7;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.12);
      --border-md: rgba(0,0,0,0.22);
      --text-primary: #1a1a18;
      --text-secondary: #5f5e5a;
      --teal: #1D9E75;
      --teal-dark: #0F6E56;
      --teal-light: #E1F5EE;
      --teal-text: #085041;
      --red: #E24B4A;
      --red-dark: #A32D2D;
      --red-light: #FCEBEB;
      --amber-light: #FAEEDA;
      --amber-text: #633806;
      --green-light: #EAF3DE;
      --green-text: #3B6D11;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --surface: #252523;
        --border: rgba(255,255,255,0.10);
        --border-md: rgba(255,255,255,0.20);
        --text-primary: #f0ede8;
        --text-secondary: #a0a09a;
        --teal-light: #04342C;
        --teal-text: #9FE1CB;
        --red-light: #501313;
        --amber-light: #412402;
        --amber-text: #FAC775;
        --green-light: #173404;
        --green-text: #C0DD97;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    #app {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    /* Camera / preview area */
    .camera-frame {
      width: 100%;
      border-radius: var(--radius-lg);
      border: 0.5px solid var(--border);
      background: var(--surface);
      overflow: hidden;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 3rem;
      color: var(--text-secondary);
      font-size: 14px;
      width: 100%;
      min-height: 260px;
      border: 1.5px dashed var(--border-md);
      border-radius: var(--radius-lg);
    }

    #placeholder i { font-size: 40px; }

    #video {
      width: 100%;
      display: none;
      border-radius: var(--radius-lg);
    }

    #canvas { display: none; }

    #preview {
      width: 100%;
      border-radius: var(--radius-lg);
      display: none;
    }

    /* Status */
    #status {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      min-height: 18px;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-md);
      background: var(--surface);
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }

    .btn:hover { background: var(--bg); }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }
    .btn-primary:hover { background: var(--teal-dark); }

    /* Loader */
    #loader {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 2rem;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2.5px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result cards */
    #results { width: 100%; }

    .result-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }

    .result-header {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 400;
    }

    .badge-danger { background: var(--red-light); color: var(--red-dark); }
    .badge-success { background: var(--green-light); color: var(--green-text); }

    .summary-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .sugar-item {
      border-left: 2.5px solid var(--red);
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      background: var(--bg);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }

    .sugar-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .sugar-aka {
      font-weight: 400;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .sugar-gi {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      margin-right: 6px;
      margin-bottom: 4px;
    }

    .gi-high { background: var(--red-light); color: var(--red-dark); }
    .gi-medium { background: var(--amber-light); color: var(--amber-text); }
    .gi-low { background: var(--green-light); color: var(--green-text); }

    .sugar-type {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .sugar-detail {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-top: 4px;
    }

    .sugar-detail strong {
      font-weight: 500;
      color: var(--text-primary);
    }

    .no-sugar {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* API key note */
    .api-note {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 0.5rem;
      line-height: 1.6;
    }

    .api-note a { color: var(--teal); }

    /* API key input */
    #apiKeySection {
      width: 100%;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #apiKeySection label {
      font-size: 13px;
      font-weight: 500;
    }

    #apiKeySection input {
      width: 100%;
      padding: 8px 12px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 13px;
      font-family: monospace;
    }

    #apiKeySection input:focus {
      outline: none;
      border-color: var(--teal);
    }
  </style>
</head>
<body>

<header>
  <h1><i class="ti ti-leaf"></i> Sugar Scanner</h1>
  <p>Scan any ingredient label to reveal hidden sugars</p>
</header>

<div id="app">

  <!-- API Key input -->
  <div id="apiKeySection">
    <label for="apiKey">Anthropic API key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." />
    <p class="api-note">
      Your key is used only in your browser and never stored or sent anywhere else.<br>
      Get one free at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>
    </p>
  </div>

  <!-- Camera area -->
  <div class="camera-frame" id="cameraFrame">
    <div id="placeholder">
      <i class="ti ti-camera"></i>
      <span>Point your camera at an ingredient label</span>
    </div>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <img id="preview" alt="Captured ingredient label" />
  </div>

  <div id="status"></div>

  <div class="btn-row" id="controls">
    <button class="btn btn-primary" onclick="startCamera()">
      <i class="ti ti-camera"></i> Open camera
    </button>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <span style="font-size:14px; color:var(--text-secondary);">Analyzing ingredients…</span>
  </div>

  <div id="results"></div>

</div>

<script>
  let stream = null;
  let capturedB64 = null;

  function setStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  function setControls(html) {
    document.getElementById('controls').innerHTML = html;
  }

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
      const video = document.getElementById('video');
      video.srcObject = stream;
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('preview').style.display = 'none';
      video.style.display = 'block';
      setStatus('Frame the ingredient list clearly, then take a photo');
      setControls(`
        <button class="btn btn-primary" onclick="capture()"><i class="ti ti-camera"></i> Take photo</button>
        <button class="btn" onclick="stopCamera()"><i class="ti ti-x"></i> Cancel</button>
      `);
    } catch (e) {
      setStatus('Camera access denied — please allow camera permissions and try again.');
    }
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    document.getElementById('video').style.display = 'none';
    document.getElementById('placeholder').style.display = 'flex';
    setStatus('');
    setControls(`<button class="btn btn-primary" onclick="startCamera()"><i class="ti ti-camera"></i> Open camera</button>`);
  }

  function capture() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    capturedB64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }

    const preview = document.getElementById('preview');
    preview.src = 'data:image/jpeg;base64,' + capturedB64;
    preview.style.display = 'block';
    document.getElementById('video').style.display = 'none';

    setStatus('Photo captured — tap Scan to analyze');
    setControls(`
      <button class="btn btn-primary" onclick="analyzeImage()"><i class="ti ti-search"></i> Scan for sugars</button>
      <button class="btn" onclick="retake()"><i class="ti ti-refresh"></i> Retake</button>
    `);
  }

  function retake() {
    document.getElementById('preview').style.display = 'none';
    document.getElementById('placeholder').style.display = 'flex';
    document.getElementById('results').innerHTML = '';
    capturedB64 = null;
    setStatus('');
    setControls(`<button class="btn btn-primary" onclick="startCamera()"><i class="ti ti-camera"></i> Open camera</button>`);
  }

  async function analyzeImage() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) {
      alert('Please enter your Anthropic API key above.');
      return;
    }
    if (!capturedB64) return;

    document.getElementById('loader').style.display = 'flex';
    document.getElementById('results').innerHTML = '';
    setControls('');
    setStatus('');

    const system = `You are a nutrition expert specializing in identifying hidden sugars in food ingredient labels.
When given an image of an ingredient label, identify every ingredient that is a form of sugar, sweetener, or sugar alternative.
Respond ONLY with valid JSON — no markdown fences, no preamble:
{
  "ingredients_found": true,
  "sugar_alternatives": [
    {
      "name": "exact name as on label",
      "common_name": "commonly known as",
      "type": "refined sugar | natural sugar | sugar alcohol | artificial sweetener | syrup | other",
      "gi_index": "numeric value or range, or N/A",
      "gi_category": "high (>70) | medium (56-69) | low (<55) | N/A",
      "health_effects": "2-3 sentences on health and metabolic impact",
      "how_processed": "brief description of how the body processes it"
    }
  ],
  "overall_sugar_load": "low | moderate | high",
  "summary": "1-2 sentence overall assessment"
}
If no ingredient label is visible, set ingredients_found to false and sugar_alternatives to [].`;

    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1500,
          system,
          messages: [{
            role: 'user',
            content: [
              { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: capturedB64 } },
              { type: 'text', text: 'Analyze this ingredient label for all sugar alternatives and sweeteners.' }
            ]
          }]
        })
      });

      const data = await resp.json();
      if (data.error) throw new Error(data.error.message);
      const raw = (data.content || []).map(i => i.text || '').join('');
      const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
      renderResults(parsed);
    } catch (e) {
      document.getElementById('results').innerHTML = `
        <div class="result-card">
          <p class="summary-text" style="color:var(--red-dark);">
            Error: ${e.message || 'Could not analyze the image. Please check your API key and try again.'}
          </p>
        </div>`;
    }

    document.getElementById('loader').style.display = 'none';
    setControls(`<button class="btn btn-primary" onclick="startCamera()"><i class="ti ti-camera"></i> Scan another</button>`);
  }

  function giClass(cat) {
    if (!cat) return '';
    if (cat.startsWith('high')) return 'gi-high';
    if (cat.startsWith('medium')) return 'gi-medium';
    if (cat.startsWith('low')) return 'gi-low';
    return '';
  }

  function loadColor(load) {
    if (load === 'high') return { bg: 'var(--red-light)', text: 'var(--red-dark)' };
    if (load === 'moderate') return { bg: 'var(--amber-light)', text: 'var(--amber-text)' };
    return { bg: 'var(--green-light)', text: 'var(--green-text)' };
  }

  function renderResults(data) {
    const el = document.getElementById('results');

    if (!data.ingredients_found) {
      el.innerHTML = `<div class="result-card"><p class="no-sugar"><i class="ti ti-alert-circle" style="font-size:24px;display:block;margin:0 auto 8px;"></i>No ingredient label detected. Please take a clearer photo of the label.</p></div>`;
      return;
    }

    const items = data.sugar_alternatives || [];
    const lc = loadColor(data.overall_sugar_load);

    let html = `<div class="result-card">
      <div class="result-header">
        <i class="ti ti-report-search" style="font-size:18px;"></i>
        <span>Scan results</span>
        <span class="badge ${items.length > 0 ? 'badge-danger' : 'badge-success'}">${items.length} sugar${items.length !== 1 ? 's' : ''} found</span>
        <span class="badge" style="margin-left:auto;background:${lc.bg};color:${lc.text};">${data.overall_sugar_load || ''} sugar load</span>
      </div>
      <p class="summary-text">${data.summary || ''}</p>
    </div>`;

    if (items.length === 0) {
      html += `<div class="no-sugar"><i class="ti ti-circle-check" style="font-size:28px;color:var(--teal);display:block;margin:0 auto 8px;"></i>No sugar alternatives detected in this label.</div>`;
    } else {
      items.forEach(s => {
        html += `<div class="sugar-item">
          <div class="sugar-name">${s.name} <span class="sugar-aka">— ${s.common_name || ''}</span></div>
          <div style="margin:6px 0;">
            <span class="sugar-gi ${giClass(s.gi_category)}">GI: ${s.gi_index || 'N/A'}</span>
            <span class="sugar-type">${s.type || ''}</span>
          </div>
          <div class="sugar-detail"><strong>Health effects:</strong> ${s.health_effects || ''}</div>
          <div class="sugar-detail"><strong>How it's processed:</strong> ${s.how_processed || ''}</div>
        </div>`;
      });
    }

    el.innerHTML = html;
  }
</script>

</body>
</html>
