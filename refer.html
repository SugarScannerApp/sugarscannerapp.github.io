<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sugar Scanner — Referral Program</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.9.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f9f9f7;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.10);
      --border-md: rgba(0,0,0,0.20);
      --text-primary: #1a1a18;
      --text-secondary: #5f5e5a;
      --teal: #1D9E75;
      --teal-dark: #0F6E56;
      --teal-light: #E1F5EE;
      --navy: #04342C;
      --red: #E24B4A;
      --red-dark: #A32D2D;
      --red-light: #FCEBEB;
      --green-light: #EAF3DE;
      --green-text: #3B6D11;
      --radius-md: 8px;
      --radius-lg: 14px;
      --radius-xl: 22px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }
    nav {
      background: var(--navy);
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }
    .nav-logo i { color: #9FE1CB; font-size: 18px; }
    .nav-back {
      color: #9FE1CB;
      font-size: 13px;
      text-decoration: none;
    }
    .main {
      max-width: 560px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .hero-text {
      text-align: center;
      padding: 1.5rem 0 0.5rem;
    }
    .hero-text h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .hero-text p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.65;
      max-width: 400px;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
    }
    .card h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text-primary);
    }
    .btn {
      padding: 10px 20px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--teal);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--teal-dark); }
